[project]
name = "test-project"
version = "0.1.0"
description = "Numerical and analytic calculations for this project"
requires-python = ">=3.11"
dependencies = [
	"numpy>=2.0",
	"scipy>=1.13",
	"sympy>=1.13",
	"matplotlib>=3.9",
]

[dependency-groups]
dev = [
	"pytest>=8",
	"ruff>=0.6",
	"jupyterlab>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calc/python/hepcalc"]

[tool.pytest.ini_options]
testpaths = ["calc/python/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
indent-style = "tab"
